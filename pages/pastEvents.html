    <style>
       .lines-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .line {
      position: absolute;
      height: 4px;
      transition: width 0.3s;
    }

    .line.first {
      background-color: #ffcd29;
      width: 180px;
      top: 0;
    }

    .line.middle {
      background-color: #208820;
      width: 220px;
      top: 8px;
    }

    .line.last {
      background-color: #e4554e;
      width: 180px;
      top: 16px;
    }

    </style>
